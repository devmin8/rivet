<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Rivet - Self-hosted PaaS for your VPS">
  <rect width="1200" height="630" fill="#FCFCFC"/>

  <g transform="translate(120 180)">
    <g transform="scale(3.2)">
      <rect x="2" y="13" width="16" height="4" rx="2" fill="#1A1A1A" opacity="0.25"/>
      <rect x="2" y="8" width="16" height="4" rx="2" fill="#1A1A1A" opacity="0.55"/>
      <rect x="2" y="3" width="16" height="4" rx="2" fill="#1A1A1A"/>
    </g>

    <text
