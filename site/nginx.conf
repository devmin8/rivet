server {
  listen 80;
  server_name _;

  # Static files produced by `bun run build` in the Docker build stage.
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  # Vite fingerprints built assets, so they can be cached aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Unknown marketing site paths should keep a 404 status while using the
  # branded error page above.
  location / {
    try_files $uri $uri/ =404;
  }
}
