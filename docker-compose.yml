services:
  rivet-caddy:
    image: caddy:2-alpine
    container_name: rivet-caddy
    restart: unless-stopped
    environment:
      CADDY_ADMIN: 0.0.0.0:2019
    ports:
      - '127.0.0.1:${CADDY_PORT:-80}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOME}/.rivet/caddy/data:/data
      - ${HOME}/.rivet/caddy/config:/config
      - ${HOME}/.rivet/caddy/logs:/var/log/caddy
    networks:
      - rivet-network

  rivet-console:
    build:
      context: ./console
    image: rivet-console:dev
    container_name: rivet-console
    restart: unless-stopped
    networks:
      - rivet-network

  rivet-server:
    build:
      context: .
    image: rivet-server:dev
    container_name: rivet-server
    restart: unless-stopped
    depends_on:
      - rivet-caddy
      - rivet-console
    environment:
      PORT: 3000
      DOMAIN: rivet-server.localhost
      APP_ENV: dev
      DB_PATH: /data/rivet.db
      CADDY_ACCESS_LOG_PATH: /var/log/rivet-caddy/access.log
      # Static dev-only key. Never use this value for production installs.
      RIVET_SECRET_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    volumes:
      - ${HOME}/.rivet/server/data:/data
      - ${HOME}/.rivet/caddy/logs:/var/log/rivet-caddy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rivet-network

networks:
  rivet-network:
    name: rivet-network
